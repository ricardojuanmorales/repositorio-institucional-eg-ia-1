<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" role="img" aria-labelledby="t d"><title id="t">Ecología bibliográfica RIB-EG-IA</title><desc id="d">Cuatro colecciones CAT, FIC, MAT y CUR se conectan con un nodo de investigación, educación y creación responsable.</desc><rect width="1040" height="380" rx="24" fill="#f3f8f9"/><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="80" y="55" width="215" height="100" rx="16" fill="#d9ebe8"/><text x="105" y="97" fill="#174a51">CAT · 60</text><text x="105" y="125" font-size="15" font-weight="400" fill="#35646b">Catálogo</text><rect x="745" y="55" width="215" height="100" rx="16" fill="#f8e7cf"/><text x="770" y="97" fill="#684a21">FIC · 60</text><text x="770" y="125" font-size="15" font-weight="400" fill="#82633d">Fichas anotadas</text><rect x="80" y="225" width="215" height="100" rx="16" fill="#e7e1f5"/><text x="105" y="267" fill="#504276">MAT · 60</text><text x="105" y="295" font-size="15" font-weight="400" fill="#716194">Matrices</text><rect x="745" y="225" width="215" height="100" rx="16" fill="#f5dfd9"/><text x="770" y="267" fill="#8b4f45">CUR · 150</text><text x="770" y="295" font-size="15" font-weight="400" fill="#98675e">Asignaciones</text></g><g stroke="#769da4" stroke-width="4" fill="none"><path d="M295 105 408 174M745 105 630 174M295 275 408 206M745 275 630 206"/></g><rect x="387" y="136" width="266" height="108" rx="45" fill="#164c5d"/><text x="520" y="181" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Investigación</text><text x="520" y="210" text-anchor="middle" fill="#d6f5f0" font-family="Arial,sans-serif" font-size="17">Educación · creación</text><text x="520" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#4b6971">Las conexiones se contrastan; compartir un código no prueba identidad bibliográfica.</text></svg>